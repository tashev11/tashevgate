<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">TashevGate v0.1 validation metrics</title>
<defs><linearGradient id="vg" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient></defs>
<rect width="1200" height="300" rx="26" fill="url(#vg)"/>
<text x="60" y="57" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">v0.1 release validation</text>
<text x="60" y="86" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Measured from the current repository before release.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="60" y="125" width="245" height="120" rx="20" fill="#fff" stroke="#dbeafe"/>
  <text x="88" y="165" fill="#64748b" font-size="13" font-weight="700">AUTOMATED TESTS</text>
  <text x="88" y="210" fill="#2563eb" font-size="42" font-weight="900">12</text>
  <text x="150" y="210" fill="#64748b" font-size="16">passed</text>

  <rect x="325" y="125" width="245" height="120" rx="20" fill="#fff" stroke="#ddd6fe"/>
  <text x="353" y="165" fill="#64748b" font-size="13" font-weight="700">SELF-SCAN FINDINGS</text>
  <text x="353" y="210" fill="#059669" font-size="42" font-weight="900">0</text>
  <text x="393" y="210" fill="#64748b" font-size="16">blockers</text>

  <rect x="590" y="125" width="245" height="120" rx="20" fill="#fff" stroke="#dbeafe"/>
  <text x="618" y="165" fill="#64748b" font-size="13" font-weight="700">REPORT FORMATS</text>
  <text x="618" y="210" fill="#7c3aed" font-size="42" font-weight="900">4</text>
  <text x="657" y="210" fill="#64748b" font-size="16">Console · MD · JSON · SARIF</text>

  <rect x="855" y="125" width="285" height="120" rx="20" fill="#0f172a"/>
  <text x="883" y="165" fill="#93c5fd" font-size="13" font-weight="700">SELF-SCAN RELEASE STATE</text>
  <text x="883" y="213" fill="#4ade80" font-size="36" font-weight="900">READY</text>
</g>
</svg>