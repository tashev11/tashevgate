<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title">
<title id="title">TashevGate roadmap from static gate to release guardian</title>
<defs>
  <linearGradient id="r" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
</defs>
<rect width="1200" height="400" rx="28" fill="#0b1120"/>
<text x="60" y="58" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Roadmap: from static gate to release guardian</text>
<text x="60" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Each stage adds stronger evidence without hiding risk behind a score.</text>
<line x1="110" y1="215" x2="1080" y2="215" stroke="#263653" stroke-width="8" stroke-linecap="round"/>
<line x1="110" y1="215" x2="370" y2="215" stroke="url(#r)" stroke-width="8" stroke-linecap="round"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <circle cx="150" cy="215" r="24" fill="#2563eb"/><text x="141" y="223" fill="#fff" font-size="16" font-weight="900">1</text>
  <text x="95" y="160" fill="#93c5fd" font-size="13" font-weight="800">v0.1 · NOW</text>
  <text x="80" y="265" fill="#fff" font-size="17" font-weight="800">Static gate</text>
  <text x="63" y="291" fill="#94a3b8" font-size="13">secrets · migrations · CI</text>

  <circle cx="420" cy="215" r="24" fill="#334155"/><text x="411" y="223" fill="#fff" font-size="16" font-weight="900">2</text>
  <text x="355" y="160" fill="#c4b5fd" font-size="13" font-weight="800">NEXT</text>
  <text x="350" y="265" fill="#fff" font-size="17" font-weight="800">Framework aware</text>
  <text x="342" y="291" fill="#94a3b8" font-size="13">Next.js · FastAPI · Supabase</text>

  <circle cx="690" cy="215" r="24" fill="#334155"/><text x="681" y="223" fill="#fff" font-size="16" font-weight="900">3</text>
  <text x="625" y="160" fill="#c4b5fd" font-size="13" font-weight="800">PLANNED</text>
  <text x="620" y="265" fill="#fff" font-size="17" font-weight="800">Staging sandbox</text>
  <text x="602" y="291" fill="#94a3b8" font-size="13">build · DB · auth · browser</text>

  <circle cx="960" cy="215" r="24" fill="#334155"/><text x="951" y="223" fill="#fff" font-size="16" font-weight="900">4</text>
  <text x="895" y="160" fill="#c4b5fd" font-size="13" font-weight="800">VISION</text>
  <text x="890" y="265" fill="#fff" font-size="17" font-weight="800">Release guardian</text>
  <text x="865" y="291" fill="#94a3b8" font-size="13">deploy · health · rollback proof</text>
</g>
<rect x="60" y="330" width="1080" height="42" rx="13" fill="#111827"/>
<text x="84" y="356" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Target: verifiable release evidence for AI-built software — not another code-quality percentage.</text>
</svg>