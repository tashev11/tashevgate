<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">TashevGate — production readiness gate for AI-built software</title>
<desc id="desc">Dark gradient hero banner with READY and BLOCKED release states.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070b16"/>
    <stop offset=".55" stop-color="#111c3b"/>
    <stop offset="1" stop-color="#31105a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#42a5ff"/>
    <stop offset="1" stop-color="#9b5cff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="965" cy="70" r="150" fill="#4f46e5" opacity=".18" filter="url(#glow)"/>
<circle cx="1070" cy="300" r="150" fill="#9333ea" opacity=".16" filter="url(#glow)"/>
<g transform="translate(72 68)">
  <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#accent)"/>
  <path d="M16 25h20v17H16z" fill="#fff" opacity=".98"/>
  <path d="M21 25v-5c0-7 10-7 10 0v5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="68" y="39" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">TashevGate</text>
  <text x="0" y="105" fill="#9ccfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">FROM VIBE CODE TO REAL PRODUCT</text>
  <text x="0" y="166" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">Ship AI-built software</text>
  <text x="0" y="218" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">without guessing.</text>
  <text x="0" y="258" fill="#b9c4dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Secrets · migrations · auth · recovery · CI · release evidence</text>
  <rect x="0" y="294" width="192" height="48" rx="13" fill="url(#accent)"/>
  <text x="31" y="325" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">READY / BLOCKED</text>
  <text x="211" y="325" fill="#8fa4c8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">tashevgate check .</text>
</g>
<g transform="translate(720 74)">
  <rect width="410" height="270" rx="22" fill="#09111f" stroke="#344365"/>
  <text x="26" y="40" fill="#8fa4c8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">PROJECT SCAN RESULT</text>
  <circle cx="45" cy="92" r="23" fill="#173f2a"/>
  <path d="M34 92l8 8 15-18" fill="none" stroke="#54e693" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="99" fill="#54e693" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">READY</text>
  <rect x="26" y="132" width="170" height="52" rx="12" fill="#0e1b31"/>
  <text x="42" y="154" fill="#7d8eac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">BLOCKERS</text>
  <text x="42" y="174" fill="#54e693" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">0</text>
  <rect x="214" y="132" width="170" height="52" rx="12" fill="#0e1b31"/>
  <text x="230" y="154" fill="#7d8eac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">REPORT FORMATS</text>
  <text x="230" y="174" fill="#60a5fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">4</text>
  <rect x="26" y="202" width="358" height="42" rx="11" fill="#10273a"/>
  <circle cx="46" cy="223" r="6" fill="#54e693"/>
  <text x="62" y="228" fill="#a8f0c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">No release blockers found. Safe to continue.</text>
</g>
</svg>