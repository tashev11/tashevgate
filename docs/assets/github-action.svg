<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
<title id="title">TashevGate GitHub Action workflow</title>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<text x="60" y="58" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Drop TashevGate into your pull-request flow</text>
<text x="60" y="88" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">One reusable GitHub Action can stop an obvious release blocker before merge.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="70" y="140" width="205" height="100" rx="20" fill="#fff" stroke="#d9e2f2"/>
  <text x="98" y="178" fill="#64748b" font-size="13" font-weight="700">01 · PUSH / PR</text>
  <text x="98" y="210" fill="#0f172a" font-size="19" font-weight="800">New change</text>

  <rect x="345" y="120" width="240" height="140" rx="22" fill="#0f172a"/>
  <text x="375" y="162" fill="#93c5fd" font-size="13" font-weight="700">02 · TASHEVGATE</text>
  <text x="375" y="197" fill="#fff" font-size="20" font-weight="800">Scan + policy</text>
  <text x="375" y="227" fill="#94a3b8" font-size="14">SARIF · JSON · exit code</text>

  <rect x="660" y="120" width="190" height="62" rx="18" fill="#ecfdf5" stroke="#86efac"/>
  <text x="704" y="157" fill="#047857" font-size="18" font-weight="900">READY</text>
  <rect x="660" y="198" width="190" height="62" rx="18" fill="#fff1f2" stroke="#fda4af"/>
  <text x="695" y="235" fill="#be123c" font-size="18" font-weight="900">BLOCKED</text>

  <rect x="925" y="140" width="205" height="100" rx="20" fill="#fff" stroke="#d9e2f2"/>
  <text x="953" y="178" fill="#64748b" font-size="13" font-weight="700">03 · OUTCOME</text>
  <text x="953" y="207" fill="#0f172a" font-size="17" font-weight="800">merge / fix first</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#m)">
  <path d="M275 190H330"/>
  <path d="M585 190H638"/>
  <path d="M850 190H910"/>
</g>
</svg>