<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title">
<title id="title">TashevGate checks grid</title>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#121a34"/></linearGradient>
  <linearGradient id="a" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect width="1200" height="470" rx="28" fill="url(#bg)"/>
<text x="60" y="62" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">One gate. Multiple release risks.</text>
<text x="60" y="92" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">TashevGate checks the project around the code — not only the code itself.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(60 135)">
    <rect width="250" height="120" rx="20" fill="#0f1d31" stroke="#253552"/>
    <circle cx="38" cy="38" r="20" fill="#1e3a8a"/><text x="30" y="46" fill="#93c5fd" font-size="22">🔐</text>
    <text x="70" y="37" fill="#fff" font-size="18" font-weight="800">Secrets</text>
    <text x="24" y="75" fill="#9fb0c9" font-size="14">keys · tokens · .env</text>
    <text x="24" y="99" fill="#9fb0c9" font-size="14">frontend secret exposure</text>
  </g>
  <g transform="translate(325 135)">
    <rect width="250" height="120" rx="20" fill="#0f1d31" stroke="#253552"/>
    <circle cx="38" cy="38" r="20" fill="#3b205f"/><text x="30" y="46" fill="#c4b5fd" font-size="22">🗄</text>
    <text x="70" y="37" fill="#fff" font-size="18" font-weight="800">Database</text>
    <text x="24" y="75" fill="#9fb0c9" font-size="14">destructive migrations</text>
    <text x="24" y="99" fill="#9fb0c9" font-size="14">backup + rollback evidence</text>
  </g>
  <g transform="translate(590 135)">
    <rect width="250" height="120" rx="20" fill="#0f1d31" stroke="#253552"/>
    <circle cx="38" cy="38" r="20" fill="#14382c"/><text x="30" y="46" fill="#86efac" font-size="22">🧪</text>
    <text x="70" y="37" fill="#fff" font-size="18" font-weight="800">Tests &amp; CI</text>
    <text x="24" y="75" fill="#9fb0c9" font-size="14">missing tests</text>
    <text x="24" y="99" fill="#9fb0c9" font-size="14">missing GitHub Actions</text>
  </g>
  <g transform="translate(855 135)">
    <rect width="285" height="120" rx="20" fill="#0f1d31" stroke="#253552"/>
    <circle cx="38" cy="38" r="20" fill="#3b2514"/><text x="30" y="46" fill="#fbbf24" font-size="22">⚙</text>
    <text x="70" y="37" fill="#fff" font-size="18" font-weight="800">Runtime</text>
    <text x="24" y="75" fill="#9fb0c9" font-size="14">debug · wildcard CORS</text>
    <text x="24" y="99" fill="#9fb0c9" font-size="14">admin auth heuristics</text>
  </g>

  <g transform="translate(60 275)">
    <rect width="345" height="125" rx="20" fill="#0f1d31" stroke="#253552"/>
    <text x="24" y="36" fill="#60a5fa" font-size="14" font-weight="800">REPOSITORY READINESS</text>
    <text x="24" y="70" fill="#fff" font-size="18" font-weight="800">Reproducible builds</text>
    <text x="24" y="98" fill="#9fb0c9" font-size="14">.gitignore · lock files · workflow presence</text>
  </g>
  <g transform="translate(430 275)">
    <rect width="330" height="125" rx="20" fill="#0f1d31" stroke="#253552"/>
    <text x="24" y="36" fill="#c4b5fd" font-size="14" font-weight="800">POLICY ENGINE</text>
    <text x="24" y="70" fill="#fff" font-size="18" font-weight="800">Your threshold</text>
    <text x="24" y="98" fill="#9fb0c9" font-size="14">blocker · high · medium · info</text>
  </g>
  <g transform="translate(785 275)">
    <rect width="355" height="125" rx="20" fill="url(#a)"/>
    <text x="24" y="36" fill="#dbeafe" font-size="14" font-weight="800">RELEASE DECISION</text>
    <text x="24" y="77" fill="#fff" font-size="28" font-weight="900">READY / BLOCKED</text>
    <text x="24" y="103" fill="#e9e8ff" font-size="14">machine-readable exit code + evidence</text>
  </g>
</g>
</svg>