name: TashevGate Production Readiness Gate
description: Block risky AI-built software before production.
author: Rinat Tashev

inputs:
  path:
    description: Project path to scan
    required: false
    default: "."
  fail-on:
    description: Minimum severity that blocks the job
    required: false
    default: "blocker"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install TashevGate action package
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Create report directory
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/.tashevgate"
    - name: Generate SARIF
      shell: bash
      run: |
        set +e
        tashevgate check "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" --format sarif --output "$GITHUB_WORKSPACE/.tashevgate/tashevgate.sarif"
        code=$?
        echo "$code" > "$GITHUB_WORKSPACE/.tashevgate/exit-code"
        exit 0
    - name: Enforce gate
      shell: bash
      run: |
        tashevgate check "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}"

branding:
  icon: shield
  color: purple
